name: PR checks

# Automatic checks on every PR (ops #329, same shape as infra-TAK's PR checks). No Claude involved.
# A red check blocks the merge once `checks-ok` is made a required check. Run the same things locally:
#   bash .github/ci/static_checks.sh      (needs shellcheck and PyYAML)
#   bash .github/ci/release_hygiene.sh    (VERSION, newest tag and newest CHANGELOG section agree; ops #370)
#   bash .github/ci/test_linux_host.sh    (the Linux host's pure-shell parts; runs on any Linux x86-64; ops #528)
#   pwsh -File .github/ci/test_windows_gpu.ps1   (the Windows GPU choice; ops #590)
#   bash .github/ci/test_release_gate.sh  (release.sh refuses to run without a passed install-and-update smoke; ops #693)
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

# GitHub-hosted runners only (public repo; fork PRs must never reach the self-hosted Studio runners).
# Pinned to ubuntu-24.04, not ubuntu-latest, so the checks mean the same thing every run.
jobs:
  # bash -n, shellcheck (errors fail, warnings are listed), JSON/YAML parse, Python compile.
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # shellcheck pinned so "error" means the same thing every run (the runner image's own moves).
      - run: pip install shellcheck-py==0.11.0.1 pyyaml && shellcheck --version
      - run: bash .github/ci/static_checks.sh

  # PowerShell parse check for the Windows engine (install.ps1, takwerx.ps1, lib/windows/, tools/).
  # pwsh ships on the hosted runner. Parse only: nothing is run. The files must stay ASCII
  # (Windows PowerShell 5.1 reads a BOM-less file as the ANSI code page; CLAUDE.md says ASCII only).
  powershell:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./.github/ci/ps_parse.ps1
      # The GPU choice's pure functions, on the PC from atak-terminal #19 (ops #590).
      - shell: pwsh
        run: ./.github/ci/test_windows_gpu.ps1

  # The Linux host: pins present, engine starts, GNU-userland helpers, launcher entry (ops #528).
  # Needs no KVM and downloads nothing.
  linux-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: bash .github/ci/test_linux_host.sh

  # VERSION must match the newest tag and the newest CHANGELOG section (users receive tags, never main's head).
  # A -dev version on dev that is ahead of the tag is allowed. Needs the tags, so a full checkout.
  release-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash .github/ci/test_release_hygiene.sh
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/ci/release_hygiene.sh

  # release.sh must refuse to run unless tools/release-smoke.sh passed for this exact tree (ops #693).
  # The smoke itself needs a Mac and downloads the pinned tools, so the release worker runs it
  # before every release; here the gate is tested, and the smoke's quick mode runs without downloads.
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash .github/ci/test_release_gate.sh
      - run: bash tools/release-smoke.sh 99.0.0 --quick

  # One stable name to require in branch protection. A failed or cancelled job fails it.
  checks-ok:
    if: always()
    needs: [static, powershell, linux-host, release-hygiene, release-gate]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::a required check failed"; exit 1 ;;
          esac
