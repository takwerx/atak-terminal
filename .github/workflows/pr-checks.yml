name: PR checks

# Automatic checks on every PR (ops #329, same shape as infra-TAK's PR checks). No Claude involved.
# Also run on every push to dev and main (ops #1168, same fix as mediamtx-installer's ops #1160): two PRs that each
# pass alone can fail together once both are merged, and PR checks never see that. Same jobs, same checks-ok.
# A red check blocks the merge once `checks-ok` is made a required check. Run the same things locally:
#   bash .github/ci/static_checks.sh      (needs shellcheck and PyYAML)
#   bash .github/ci/release_hygiene.sh    (VERSION, newest tag and newest CHANGELOG section agree; ops #370)
#   bash .github/ci/test_linux_host.sh    (the Linux host's pure-shell parts; runs on any Linux x86-64; ops #528)
#   pwsh -File .github/ci/test_windows_gpu.ps1   (the Windows GPU choice; ops #590)
#   bash .github/ci/test_release_gate.sh  (release.sh refuses to run without a passed install-and-update smoke; ops #693)
#   bash .github/ci/test_release_assets.sh   (self-test of release_assets.sh; ops #1021. The live check of the newest
#                                         release runs daily in release-assets-watch.yml, not here)
#   bash .github/ci/test_lima_pin.sh      (Lima is 2.3.0 or newer and its pins match the release; ops #825)
#   bash .github/ci/test_init_runtime.sh  (init --runtime redroid looks for Android on the redroid endpoint; ops #861)
#   bash .github/ci/test_market_lookup.sh (the Market plugin is found when GitHub's API is rate-limited; ops #1274)
#   bash .github/ci/test_downgrade_guard.sh   (install line, update, tools and the Android device never go backwards; ops #1318)
#   pwsh -File .github/ci/test_windows_guard.ps1   (the same rules for the Windows engine; ops #1318)
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, main]

concurrency:
  # PRs by number, pushes by branch (github.ref), so a push to dev never cancels a PR run and the
  # two never share a group. Only PR runs cancel an older run; a push run always finishes.
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# GitHub-hosted runners only (public repo; fork PRs must never reach the self-hosted Studio runners).
# Pinned to ubuntu-24.04, not ubuntu-latest, so the checks mean the same thing every run.
jobs:
  # bash -n, shellcheck (errors fail, warnings are listed), JSON/YAML parse, Python compile.
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # shellcheck pinned so "error" means the same thing every run (the runner image's own moves).
      - run: pip install --require-hashes -r .github/ci/requirements-ci.lock && shellcheck --version
      - run: bash .github/ci/static_checks.sh

  # PowerShell parse check for the Windows engine (install.ps1, takwerx.ps1, lib/windows/, tools/).
  # pwsh ships on the hosted runner. Parse only: nothing is run. The files must stay ASCII
  # (Windows PowerShell 5.1 reads a BOM-less file as the ANSI code page; CLAUDE.md says ASCII only).
  powershell:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./.github/ci/ps_parse.ps1
      # The GPU choice's pure functions, on the PC from atak-terminal #19 (ops #590).
      - shell: pwsh
        run: ./.github/ci/test_windows_gpu.ps1
      # Never go backwards: the Windows engine's version, tool and Android device decisions (ops #1318).
      - shell: pwsh
        run: ./.github/ci/test_windows_guard.ps1

  # The Linux host: pins present, engine starts, GNU-userland helpers, launcher entry (ops #528).
  # Needs no KVM and downloads nothing.
  linux-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: bash .github/ci/test_linux_host.sh

  # VERSION must match the newest tag and the newest CHANGELOG section (users receive tags, never main's head).
  # A -dev version on dev that is ahead of the tag is allowed. Needs the tags, so a full checkout.
  release-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash .github/ci/test_release_hygiene.sh
      - env:
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: bash .github/ci/release_hygiene.sh

  # release.sh must refuse to run unless tools/release-smoke.sh passed for this exact tree (ops #693).
  # The smoke itself needs a Mac and downloads the pinned tools, so the release worker runs it
  # before every release; here the gate is tested, and the smoke's quick mode runs without downloads.
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash .github/ci/test_release_gate.sh
      - run: bash tools/release-smoke.sh 99.0.0 --quick

  # Self-test of .github/ci/release_assets.sh (ops #1021): made-up release answers, including a release with no
  # assets (what v0.2.13 and v0.2.14 looked like). It never reads the live release, so it stays green. The live
  # check runs daily in release-assets-watch.yml; it is not a PR check because it is red between release.sh
  # and the release worker's `release-assets`, which would block unrelated PRs.
  release-assets-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: bash .github/ci/test_release_assets.sh

  # Lima (the VM tool takwerx installs) must stay at 2.3.0 or newer, with the SHA-256 pins the Lima release publishes (ops #825).
  lima-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: bash .github/ci/test_lima_pin.sh

  # `takwerx init --runtime redroid` must look for Android where redroid is, even when the saved runtime was the emulator (ops #861).
  init-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: bash .github/ci/test_init_runtime.sh

  # The Market plugin step must still find the release when GitHub's API says 403 (rate limit), and must say so plainly when it cannot (ops #1274).
  market-lookup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: bash .github/ci/test_market_lookup.sh

  # takwerx never moves to an older takwerx, tool or Android image (ops #1318, same trap as the Authentik redis crash
  # loop, ops #1306): the install line and `takwerx update` against a fake GitHub, tool pins, the Android device, release.sh.
  downgrade-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: bash .github/ci/test_downgrade_guard.sh

  # Android's data volume remembers which image wrote it; a new pin replaces the container, an older pin is refused (ops #1319).
  android-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: bash .github/ci/test_android_image.sh

  # An update never replaces a tool under a running Android, leaves no unpack folder behind, and never gives an Intel Mac the arm64 emulator (ops #1319).
  update-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: bash .github/ci/test_update_safety.sh

  # Workflow files stay safe (ops #1014): every action pinned to a full commit SHA, read-only default token, the
  # security scans (not required yet) keep their shape. Run locally: python3 -I .github/ci/test_workflow_pins.py
  workflow-pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: python3 -I .github/ci/test_workflow_pins.py

  # The push trigger, the concurrency group and the release-hygiene base branch stay as ops #1168 set them.
  # Run locally: python3 -I .github/ci/test_push_checks.py
  push-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: python3 -I .github/ci/test_push_checks.py

  # One stable name to require in branch protection. A failed or cancelled job fails it.
  checks-ok:
    if: always()
    needs: [static, powershell, linux-host, release-hygiene, release-gate, release-assets-test, lima-pin, init-runtime, market-lookup, downgrade-guard, android-image, update-safety, workflow-pins, push-checks]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::a required check failed"; exit 1 ;;
          esac
